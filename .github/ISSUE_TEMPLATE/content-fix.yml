name: Content fix
description: Report a mistake on a page of princetronics.com
title: 'Content fix: '
labels: [content-fix]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page with the mistake.
      placeholder: https://www.princetronics.com/projects/...
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What the page says, and what it should say.
    validations:
      required: true

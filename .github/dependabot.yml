# Dependabot version updates: weekly, grouped, and a release proposed only once it is 7 days old,
# 14 for a SemVer major. Security updates are a repository setting and skip the cooldown.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The site at the root and the CDK app in infra/ are separate npm packages, each with its own lockfile.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/infra"
    schedule:
      interval: "weekly"
    # A dependency joins the first group it matches; `-other` takes what has no SemVer level.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
      npm-other:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14

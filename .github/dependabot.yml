# Dependabot version updates: weekly, grouped, and a release proposed only once it is 7 days old,
# 14 for a SemVer major. Security updates are a repository setting and skip the cooldown.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # The site at the root and the CDK app in infra/ are separate npm packages, each with its own lockfile.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/infra"
    schedule:
      interval: "weekly"
    # A dependency joins the first group it matches; `-other` takes what has no SemVer level.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
      npm-other:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
    # An ignore covers both directories: the site's TypeScript stays at 6, and infra's at 7 only because the ignore is shared.
    ignore:
      # The site's @astrojs/check peers on TypeScript 5 or 6: lift once it and astro check support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # infra's @types/node tracks the Node major in .nvmrc (24): lift when the repo moves to Node 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:dist

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm run build:edge
      - run: npm ci
        working-directory: infra
      - run: npm test
        working-directory: infra
      - run: npx tsc --noEmit
        working-directory: infra
      - run: >-
          npx cdk synth -q
          -c workloadAccount=111111111111 -c zoneAccount=222222222222 -c hostedZoneId=Z0000000000EXAMPLE
          -c contentRepo=example@111/content@222 -c budgetEmail=budget@example.com
        working-directory: infra
